server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The game is a single self-contained page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always serve the freshest game build (dev moves fast)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # nginx add_header inheritance is all-or-nothing: because this location
        # declares its own add_header, it does NOT inherit the server-level
        # hardening headers below. Repeat them here or /index.html responses
        # silently go out without them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        expires off;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    # Basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
