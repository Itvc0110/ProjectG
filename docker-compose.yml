services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: projectg-fps:latest
    container_name: projectg-fps
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
